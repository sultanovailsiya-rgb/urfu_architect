<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;padding:0;overflow:hidden}#canvas{display:block;width:3120px;height:1080px}</style></head>
<body>
<div id="canvas"></div>
<script src="https://unpkg.com/bpmn-js@17/dist/bpmn-viewer.production.min.js"></script>
<script>
(async () => {
  try {
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    const resp = await fetch(file);
    let xml = await resp.text();
    const viewer = new BpmnJS({ container: '#canvas' });
    const { warnings } = await viewer.importXML(xml);
    window.__warnings = (warnings || []).map(w => w.message || String(w));
    const { svg } = await viewer.saveSVG();
    window.__svghead = svg.slice(0, 200);
  } catch (e) { window.__err = String(e); }
})();
</script>
</body>
</html>
